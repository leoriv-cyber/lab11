!<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicación de Notas</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div id="notificacion" class="notificacion oculta" role="status" aria-live="polite">
        <span id="mensaje-notificacion"></span>
        <button id="btn-deshacer" class="btn-deshacer oculta">Deshacer</button>
    </div>

    <main class="contenedor">
        <h1>Gestor de Notas</h1>

        <form id="form-nota" class="formulario">
            <div class="campo">
                <label for="titulo">Título de la nota:</label>
                <input type="text" id="titulo" name="titulo" required>
            </div>

            <div class="campo">
                <label for="contenido">Contenido:</label>
                <textarea id="contenido" name="contenido" rows="4" required></textarea>
            </div>

            <button type="submit" id="btn-guardar" class="btn-primario">Agregar Nota</button>
        </form>

        <section class="seccion-notas">
            <h2>Mis Notas</h2>
            <div id="lista-notas" class="grid-notas"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
